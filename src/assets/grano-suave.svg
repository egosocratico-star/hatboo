<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256">
  <!-- Mismo ruido que `grano-fuerte.svg`; solo cambia el `opacity` del rect. Ver ese
       archivo para qué hace cada atributo del filtro. -->
  <filter id="g" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" seed="7" />
    <feColorMatrix type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncA type="linear" slope="0" intercept="1" />
    </feComponentTransfer>
  </filter>
  <rect width="256" height="256" filter="url(#g)" opacity="0.15" />
</svg>
