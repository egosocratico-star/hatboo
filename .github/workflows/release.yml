name: Release

# Construye el instalador de Windows y lo cuelga de una GitHub release al empujar
# una etiqueta tipo `v0.3.0`.
#
# Probado con la v0.3.0: se construyó y publicó solo, en 8m32s. La versión debe
# subir a la vez en package.json, src-tauri/Cargo.toml y src-tauri/tauri.conf.json.
# El cuerpo de la release lo deja tauri-action con un texto por defecto; para un
# changelog real hay que pasarle `releaseBody` o editarlo a mano.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publicador:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      # Igual que en `ci.yml`: el brain es privado y sin PAT Cargo no resuelve.
      - name: Acceso al brain (repo privado)
        shell: bash
        env:
          PAT: ${{ secrets.HATBOO_BRAIN_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${PAT}@github.com/egosocratico-star/hatboo-brain".insteadOf "https://github.com/egosocratico-star/hatboo-brain"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Sin las claves del llavero no se puede probar Anthropic/OpenAI, y el
      # instalador no las necesita: solo se compila.
      - name: Instalador
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Hatboo ${{ github.ref_name }}
          releaseBody: Cambios en el registro de commits de esta etiqueta.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
