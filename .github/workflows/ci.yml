name: CI

# Windows es el sistema para el que existe Hatboo hoy, y el runner ya trae
# WebView2 y el SDK: en Linux habría que montar WebKitGTK y compañía solo para
# que `cargo test` pueda compilar tauri.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  comprobar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # `npm run build` es `tsc && vite build`. Hace doble trabajo: comprueba
      # tipos y deja `dist/`, que tauri-build pide al compilar los tests.
      - name: Frontend (tsc + vite)
        run: npm run build

      # La puerta que destapa lo que las de abajo no miran: `--all-targets`
      # COMPILA `agent_flow`, `local_provider` y `keyring`, que aquí no se corren
      # (piden Ollama o el llavero real). Sin este paso esas tres pueden dejar de
      # compilar y la CI seguir verde — ya pasó: `agent_flow` estuvo meses roto
      # porque ningún gate lo construía. Con `-D warnings` además no entra un lint
      # silencioso; en local está a cero con las features por defecto (`cerebro`).
      - name: Clippy (todos los targets, advertencias cortan)
        run: >
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
          -- -D warnings

      # A propósito fuera: agent_flow y local_provider hablan con un Ollama en
      # marcha, y keyring usa el llavero real de la máquina. Son pruebas de
      # integración locales por diseño, no de CI. Lo que sí hace el paso de arriba
      # es compilarlas.
      - name: Pruebas de Rust
        run: >
          cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast
          --lib --test db --test backup --test git_tools --test tools
