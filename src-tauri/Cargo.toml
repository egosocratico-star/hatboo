[package]
name = "hatboo"
version = "0.6.0"
description = "Hatboo — chat de IA de escritorio"
edition = "2021"

[lib]
name = "hatboo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["cerebro"]
# El cerebro de `hatboo-brain` decide, firma un Plan y recorta el contexto. Viene
# activado en la compilación para que el interruptor de Ajustes sea verdad; apagado
# por defecto *en ejecución*, que es lo que pide §11 del plan («el desktop consume
# el crate tras un flag»). Sin el interruptor el chat es byte a byte el de siempre.
cerebro = ["dep:hatboo-brain"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# El brain es público y entra por `git`, no por `path`: un `path` relativo nunca
# vale a la vez en su portátil (`../../../../hatboo-brain`) y en el runner
# (`D:\a\hatboo\hatboo\src-tauri`), y Cargo no expande variables ahí. Para iterar
# sobre el crate sin empujarlo existe `.cargo/config.toml.parche` (renombrar a
# `config.toml` para activarlo), con un `[patch]` al copia-local; ese fichero
# está fuera del repo a propósito: el `Cargo.lock` sí se comparte.
hatboo-brain = { git = "https://github.com/egosocratico-star/hatboo-brain", branch = "main", optional = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
# El Trust Gate del `HATBOO.md` decide con SHA-256 si el contenido entra al
# system prompt: tiene que ser un hash criptográfico, no uno de resumen rápido.
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
similar = "2"
walkdir = "2"
regex = "1"
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "component"] }

# Backend nativo del llavero por plataforma (keyring v3 no trae ninguno por defecto)
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Captura de pantalla para «Tomar captura» del menú + del chat.
xcap = { version = "0.9", features = ["image"] }
# Solo para codificar a PNG lo que devuelve xcap; sin decodificadores.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# La información de depuración completa de `dev` estaba costando 65 GB: cada
# arranque del `tauri dev` dejaba otro juego de `.pdb` en `target/debug/deps`
# (25.786 archivos) y otras unidades en `incremental`. Con solo las tablas de
# líneas las trazas de pánico siguen diciendo archivo y línea, que es lo único
# que hemos leído nunca de aquí.
[profile.dev]
debug = "line-tables-only"
incremental = false
